<!doctype html>
<html>
<meta charset="utf-8">
<title>Krovvi shared chat card</title>
<!-- The picture a messaging app shows under a link to a shared chat (krovvi.com/s/<token>), 1200 x 630, in the
     site's light look: the app's own icon (app-icon.png, catch8 assets/images/icon.png as it is, never drawn again),
     the word krovvi in the logo's strokes, and one line in the chat's language (?lang=en or ar). Nothing from any chat.
     Rendered by share-cards.mjs. -->
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative; color: #1D1840;
    background: linear-gradient(180deg, #F1EEFF 0%, #F8F7FF 62%, #FFFFFF 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Arabic", "Geeza Pro", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .icon { width: 176px; height: 176px; border-radius: 22.5%; display: block;
    box-shadow: 0 34px 56px -30px rgba(91,73,242,.75), 0 10px 22px -14px rgba(29,24,64,.25); }
  .word { height: 60px; margin-top: 46px; color: #1D1840; }
  .word svg { height: 100%; width: auto; display: block; overflow: visible; }
  p { margin: 30px 0 0; font-size: 36px; line-height: 1.3; letter-spacing: -.012em; color: #6E6890; }
  p[lang="ar"] { letter-spacing: 0; font-size: 38px; }
</style>
<img class="icon" src="app-icon.png" alt="">
<div class="word" id="word"></div>
<p id="line"></p>
<script>
  /* the word in the Heavy strokes, as share.html and the site's components/look/brand.tsx write it */
  const B = 78.3, X = 32, T = 15.5, W = 14.3, f = (n) => (+n).toFixed(2);
  const st = (d, w) => `<path fill="none" stroke="currentColor" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round" d="${d}"/>`;
  function kAt(x, w) {
    const r = w / 2, s = x + r, J = [s, 68], A = [s + 26.55, X + r], lt = .48;
    const L0 = [J[0] + lt * (A[0] - J[0]), J[1] + lt * (A[1] - J[1])], L1 = [s + 27.6, B - r];
    return { svg: st(`M${f(s)} ${f(T + r)}V${f(B - r)}`, w) + st(`M${f(J[0])} ${f(J[1])}L${f(A[0])} ${f(A[1])}M${f(L0[0])} ${f(L0[1])}L${f(L1[0])} ${f(L1[1])}`, w * .96), right: L1[0] + r };
  }
  function wordAt(x, w) {
    const r = w / 2, xh = B - X, thin = .96, out = [];
    const k = kAt(x, w); out.push(k.svg); x = k.right + 6;
    { const s = x + r, tx = s + 19, ty = X + r + 1.2; out.push(st(`M${f(s)} ${f(X + r)}V${f(B - r)}`, w)); out.push(st(`M${f(s)} ${f(X + r + 17)}C${f(s)} ${f(X + r + 3)} ${f(s + 6.5)} ${f(X + r - .6)} ${f(tx)} ${f(ty)}`, w * thin)); x = tx + r + 3.2; }
    { const ow = xh * 1.03, cx = x + ow / 2, cy = B - xh / 2, ex = ow / 2 - r, ey = (xh + 1.6) / 2 - r; out.push(st(`M${f(cx - ex)} ${f(cy)}A${f(ex)} ${f(ey)} 0 1 0 ${f(cx + ex)} ${f(cy)}A${f(ex)} ${f(ey)} 0 1 0 ${f(cx - ex)} ${f(cy)}Z`, w)); x += ow + 3.6; }
    for (let n = 0; n < 2; n++) { const vw = xh * .95, a = x + r, b = x + vw - r, m = x + vw / 2; out.push(st(`M${f(a)} ${f(X + r)}L${f(m)} ${f(B - r)}L${f(b)} ${f(X + r)}`, w * thin)); x += vw + (n === 0 ? 2.4 : 5); }
    { const s = x + r, dr = r * .94; out.push(st(`M${f(s)} ${f(X + r)}V${f(B - r)}`, w)); out.push(`<circle cx="${f(s)}" cy="${f(X - 3.6 - dr)}" r="${f(dr)}" fill="currentColor"/>`); x = s + r; }
    return { svg: out.join(''), right: x };
  }
  const d = wordAt(0, W);
  document.getElementById('word').innerHTML = `<svg viewBox="-1 ${f(T - 1.5)} ${f(d.right + 2)} ${f(B - T + 2.5)}">${d.svg}</svg>`;
  /* one line, in the chat's language; Arabic says محادثة, as the app does wherever a chat is shared */
  const ar = new URLSearchParams(location.search).get('lang') === 'ar';
  const line = document.getElementById('line');
  line.textContent = ar ? 'محادثة متشاركة من كروفي' : 'A chat shared from Krovvi';
  line.lang = ar ? 'ar' : 'en';
  line.dir = ar ? 'rtl' : 'ltr';
</script>
</html>
